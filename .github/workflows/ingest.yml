name: Ingest F1 data

# Race results land within roughly 24 hours, so a daily poll keeps the database
# current without burning jolpica's 500 requests/hour budget. Rounds already
# stored are skipped, so a run with nothing new to do costs only the handful of
# requests needed to read the season schedule.
on:
  schedule:
    # 06:00 UTC daily — after a Sunday race has settled, including the late
    # night races in the Americas that finish after midnight UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to ingest (defaults to the current year)"
        required: false
        type: string

# Two ingestions must never run at once. Pit stops, overtakes and safety-car
# events are replaced per round by deleting and reinserting, so overlapping runs
# could interleave on the same round and leave it empty. Queued rather than
# cancelled, so a manual run does not abort a scheduled one mid-write.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous relative to a normal run (minutes), but the clients serialise
    # requests to respect rate limits and will wait out a 429, so a catch-up
    # run spanning several rounds needs room.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Ingest newly completed rounds
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then SEASON="$(date -u +%Y)"; fi
          echo "Ingesting season $SEASON"
          npm run backfill -- "$SEASON"

      # Prices derive from results, so they are recomputed after ingestion
      # rather than on their own schedule. Upserts make this safe to repeat even
      # when no new round arrived.
      - name: Recompute prices
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run prices

      # Scores depend on both results and prices, so this runs last. Upserts
      # make it safe to repeat when nothing new arrived.
      - name: Score rosters
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run score -- "$(date -u +%Y)"

      - name: Report coverage
        if: always()
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run db:status
